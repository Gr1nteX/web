services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solver
      POSTGRES_USER: solver
      POSTGRES_PASSWORD: solver
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U solver -d solver
      interval: 2s
      retries: 30
    restart: unless-stopped

  api1:
    build:
      context: .
      target: python
    command: python api.py
    environment:
      DATABASE_URL: postgresql://solver:solver@db/solver
      SERVER_NAME: api1
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  api2:
    build:
      context: .
      target: python
    command: python api.py
    environment:
      DATABASE_URL: postgresql://solver:solver@db/solver
      SERVER_NAME: api2
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

  worker1:
    build:
      context: .
      target: python
    command: python worker.py
    hostname: worker1
    environment:
      DATABASE_URL: postgresql://solver:solver@db/solver
    depends_on:
      db:
        condition: service_healthy
    cpus: 1
    mem_limit: 512m
    restart: unless-stopped

  worker2:
    build:
      context: .
      target: python
    command: python worker.py
    hostname: worker2
    environment:
      DATABASE_URL: postgresql://solver:solver@db/solver
    depends_on:
      db:
        condition: service_healthy
    cpus: 1
    mem_limit: 512m
    restart: unless-stopped

  scaler:
    build:
      context: .
      target: python
    command: python scaler.py
    environment:
      DATABASE_URL: postgresql://solver:solver@db/solver
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - worker1
      - worker2
    restart: unless-stopped

  nginx:
    build:
      context: .
      target: nginx
    ports:
      - "8443:443"
      - "8080:80"
    depends_on:
      - api1
      - api2
    restart: unless-stopped

volumes:
  db-data:
